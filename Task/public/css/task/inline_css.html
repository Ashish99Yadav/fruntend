<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="External.css">
</head>
<style>
#note {
    color: rgb(16, 87, 228);
}
.note {
    color: rgb(224, 69, 8);
}
</style>
<body>
        <h1>CSS Selectors</h1>
    <h2>Applying CSS to Different parts of HTML</h2>
    <ol>
    <li>
        <p>This is a paragraph inside the inline CSS example.</p>
    </li>
        <li>
        <h1  class="note">This is a paragraph inside the internal CSS example.</h1>
        </li>
        <li>
        <p id="note">This is a paragraph inside the external CSS example.</p>
        </li>
        <li>
        <p attribute="true">This is a paragraph without any CSS applied.</p> 
    </ol>
</body>
</html>
