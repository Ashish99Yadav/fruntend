<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header style="background-color: lightblue; padding: 20px; text-align: center;">
        <h1>Audio-video-iframe</h1>
    </header>
    <section>
        <h2>Audio Example</h2>
        <audio controls>
            <source src="audio.m4a" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </section>
    <section>
        <h2>Video Example</h2>
        <video width="320" height="240" controls>
            <source src="itna.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </section>
    <section>
        <h2>Iframe Example</h2>
        <iframe src="http://localhost:5173/" width="00" height="600" title="Example Iframe"></iframe>
    </section>

</body>
</html>
